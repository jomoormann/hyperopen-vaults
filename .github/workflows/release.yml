name: Release

# A version tag publishes what a self-hosted copy runs: the static site as
# an archive with checksums, and a container image that serves it. Both
# carry a build attestation, so anyone can check that they were built here
# from this commit. See docs/self-hosting.md.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Check the release tooling
        run: npm run test:release-assets

      - name: Build
        env:
          HYPEROPEN_BUILD_ID: ${{ github.sha }}
          HYPEROPEN_BUILD_BRANCH: ${{ github.ref_name }}
          HYPEROPEN_BUILD_ENV: prod
        run: npm run build

      - name: Pack the site
        id: pack
        run: |
          set -euo pipefail
          name="hyperopen-vaults-${GITHUB_REF_NAME}"
          mkdir -p dist
          # A fixed order and no owner or time in the archive, so the same
          # commit gives the same bytes.
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='UTC 2020-01-01' \
            -C out/release-public -czf "dist/${name}.tar.gz" .
          cp out/release-server/Caddyfile "dist/${name}.Caddyfile"
          (cd dist && sha256sum "${name}.tar.gz" "${name}.Caddyfile" > "${name}.sha256")
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - name: Attest the site
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/${{ steps.pack.outputs.name }}.tar.gz
            dist/${{ steps.pack.outputs.name }}.Caddyfile

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag

      - name: Log in to the container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push the image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            HYPEROPEN_BUILD_ID=${{ github.sha }}
            HYPEROPEN_BUILD_BRANCH=${{ github.ref_name }}
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only

      - name: Attest the image
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
