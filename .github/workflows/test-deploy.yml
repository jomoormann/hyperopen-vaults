name: Test deployment

# Deploys the release build to the password-protected test system on
# Cloudflare Pages: main to production (https://hyperopen-vaults.pages.dev),
# every other branch to its own preview address. Every page asks for a
# password first; see docs/test-deployment.md. Without the Cloudflare secrets
# (a fork, for example) the workflow says so and deploys nothing.

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  WRANGLER: wrangler@4.156.2
  WRANGLER_SEND_METRICS: "false"
  CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
  TEST_ACCESS_KV_ID: ${{ vars.TEST_ACCESS_KV_ID }}

jobs:
  deploy:
    # Pinned rather than ubuntu-latest, so a runner image change never
    # alters a build unnoticed. Bump it deliberately in all workflows.
    runs-on: ubuntu-24.04

    steps:
      - name: Check for Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::CLOUDFLARE_API_TOKEN or CLOUDFLARE_ACCOUNT_ID is not set; nothing is deployed."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.credentials.outputs.present == 'true'
        uses: actions/checkout@v7

      - name: Setup Node
        if: steps.credentials.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        if: steps.credentials.outputs.present == 'true'
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Dependencies
        if: steps.credentials.outputs.present == 'true'
        run: npm ci --ignore-scripts

      - name: Check the gate
        if: steps.credentials.outputs.present == 'true'
        run: npm run test:test-access

      - name: Build
        if: steps.credentials.outputs.present == 'true'
        env:
          HYPEROPEN_BUILD_ID: ${{ github.sha }}
          HYPEROPEN_BUILD_BRANCH: ${{ github.ref_name }}
          HYPEROPEN_BUILD_ENV: prod
        run: npm run build

      - name: Stage the Pages project
        if: steps.credentials.outputs.present == 'true'
        run: npm run test-access:stage

      - name: Deploy
        id: deploy
        if: steps.credentials.outputs.present == 'true'
        working-directory: out/test-pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          project="$(sed -n 's/^name = "\(.*\)"$/\1/p' wrangler.toml)"
          npx --yes "$WRANGLER" pages deploy \
            --project-name "$project" \
            --branch "$BRANCH" \
            --commit-hash "$GITHUB_SHA" \
            --commit-dirty=true | tee deploy.log
          url="$(grep -Eo 'https://[A-Za-z0-9.-]+\.pages\.dev' deploy.log | tail -n 1)"
          echo "url=${url}" >> "$GITHUB_OUTPUT"
          echo "Deployed to ${url}" >> "$GITHUB_STEP_SUMMARY"

      # The deployment must refuse a page, and a missing file under a static
      # folder (which Pages would answer with index.html), without a password,
      # and still serve static files. Otherwise the gate is not doing its job.
      - name: Check that pages ask for a password
        if: steps.credentials.outputs.present == 'true' && steps.deploy.outputs.url != ''
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            page="$(curl -s -o /dev/null -w '%{http_code}' "$URL/trade")"
            missing="$(curl -s -o /dev/null -w '%{http_code}' "$URL/js/no-such-file")"
            asset="$(curl -s -o /dev/null -w '%{http_code}' "$URL/robots.txt")"
            if [ "$page" = "401" ] && [ "$missing" = "401" ] && [ "$asset" = "200" ]; then
              echo "Gate active: /trade -> 401, /js/no-such-file -> 401, /robots.txt -> 200."
              exit 0
            fi
            echo "Attempt ${attempt}: /trade -> ${page}, /js/no-such-file -> ${missing}, /robots.txt -> ${asset}"
            sleep 10
          done
          echo "::error::The deployment at $URL does not ask for a password (or does not serve static files)."
          exit 1
