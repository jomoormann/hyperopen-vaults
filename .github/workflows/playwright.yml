name: Playwright

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    # Pinned rather than ubuntu-latest, so a runner image change never
    # alters a build unnoticed. Bump it deliberately in all workflows.
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright CI Suite
        run: npm run test:playwright:ci

      - name: Upload Playwright Artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tmp/playwright/report
            tmp/playwright/test-results
          if-no-files-found: warn
